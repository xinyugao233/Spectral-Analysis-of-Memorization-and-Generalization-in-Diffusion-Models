name: CPU review
on: [push, pull_request]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c constraints-review.txt -e .
      - run: python -m unittest discover -s tests
      - run: python scripts/verify_artifacts.py
      - run: python scripts/analyze_results.py --mode aggregate --output-dir "${RUNNER_TEMP}/spectral-aggregate"
