[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-diffusion-playground"
version = "0.1.0"
description = "Frequency-resolved experiments for studying denoising transitions and memorization in diffusion models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "LICENSE-EDM.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Gao Xinyu" }]
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "pillow",
    "scipy",
    "torch",
    "torchvision",
    "tqdm",
    "psutil",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
